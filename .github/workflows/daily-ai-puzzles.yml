name: Daily AI Puzzle Generation & Validation

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-puzzle-generation:
    name: Generate Daily AI Puzzles
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧠 Run Daily AI Generator Suite
        run: npx tsx scripts/daily-ai-cron.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
